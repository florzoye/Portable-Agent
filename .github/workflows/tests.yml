name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"
      - run: uv python install 3.13
      - run: uv run --python 3.13 python -m unittest discover -s tests -p "test_*.py"
